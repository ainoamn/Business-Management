name: work-management
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm setup:env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:env}
      POSTGRES_DB: ${POSTGRES_DB:?Run pnpm setup:env}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Run pnpm setup:env}
    ports: ['127.0.0.1:55432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run pnpm setup:env}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports: ['127.0.0.1:56379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    image: chrislusf/seaweedfs:4.51
    command: mini -dir=/data -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Run pnpm setup:env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Run pnpm setup:env}
      S3_BUCKET: ${S3_BUCKET:?Run pnpm setup:env}
    ports: ['127.0.0.1:59000:8333']
    volumes: ['storage-data:/data']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/status']
      interval: 5s
      timeout: 3s
      retries: 20
  clamav:
    image: clamav/clamav:1.4
    ports: ['127.0.0.1:3310:3310']
    volumes: ['clamav-data:/var/lib/clamav']
    healthcheck:
      test: ['CMD', '/usr/local/bin/clamd', '--ping']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
volumes:
  postgres-data:
  redis-data:
  storage-data:
  clamav-data:
